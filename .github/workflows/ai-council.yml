# «Совет нейросетей»: тесты при каждой отправке в рабочую ветку. Прошли — проверенная версия переносится в ветку
# stable, откуда обновляется сервер («Настройки → Программа → Обновить программу»). Не прошли — stable остаётся
# прежней, и сломанное на сервер не попадает.
name: ai-council tests

on:
  push:
    branches: ["claude/multi-ai-comparison-tool-50nc5z"]
    paths: ["ai-council/**", ".github/workflows/ai-council.yml"]
  workflow_dispatch:

concurrency:
  group: ai-council-${{ github.ref }}
  cancel-in-progress: true   # новая отправка отменяет проверку старой: в stable попадает только последняя проверенная

permissions:
  contents: write            # перенести проверенную версию в ветку stable

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ai-council
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-council/requirements.txt
      - name: Системные библиотеки (вёрстка PDF, шрифты)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 \
            fonts-dejavu-core poppler-utils
      - name: Зависимости
        run: pip install -r requirements.txt pytest numpy   # numpy — только тестам: делают пробный звук для голосового ввода
      - name: Тесты (без настоящих моделей — только демо)
        env:
          OPENROUTER_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Проверенная версия → ветка stable
        working-directory: .
        run: |
          git push origin "HEAD:refs/heads/stable" --force
          echo "stable = $(git rev-parse --short HEAD)"
