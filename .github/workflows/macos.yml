name: macOS app (Apple Silicon)

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[web,test]" && pytest -q

  build:
    runs-on: macos-14  # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web,test,mac]" pyinstaller

      - name: Tests
        run: pytest -q

      - name: Build dosrip.app and DMG
        run: ./packaging/macos/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dosrip-macos-arm64
          path: dist/dosrip-*-arm64.dmg
          if-no-files-found: error

      - name: Publish release (for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dosrip-*-arm64.dmg
