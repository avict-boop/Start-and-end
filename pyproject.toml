[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dosrip"
version = "0.1.0"
description = "Восстановление графики, звука, музыки и кода старых DOS-игр"
requires-python = ">=3.9"
dependencies = ["pillow>=9", "capstone>=5", "unicorn>=2"]

[project.optional-dependencies]
web = ["flask>=2"]
test = ["pytest"]
mac = ["pywebview>=5", "flask>=2"]

[project.scripts]
dosrip = "dosrip.cli:main"
dosrip-app = "dosrip.desktop:main"

[tool.setuptools.packages.find]
include = ["dosrip*"]
