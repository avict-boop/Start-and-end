# Запуск: docker compose up -d            — Telegram-бот
#         docker compose --profile web up -d — бот + веб-интерфейс (только для localhost сервера)
# Подробности — DEPLOY.md

x-common: &common
  build: .
  image: ai-council:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./config.yaml:/app/config.yaml:ro   # правьте config.yaml на сервере без пересборки
    - council-runs:/app/runs              # отчёты, стенограммы, настройки чатов бота
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  bot:
    <<: *common
    command: ["python", "-m", "council", "telegram"]

  web:
    <<: *common
    profiles: ["web"]
    command: ["python", "-m", "council", "web", "--host", "0.0.0.0", "--port", "8000"]
    # Порт открыт только на самом сервере: у веб-интерфейса нет пароля.
    # Заходить через SSH-туннель (см. DEPLOY.md).
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/config', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  council-runs:
