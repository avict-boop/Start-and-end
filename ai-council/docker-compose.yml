# Запуск (обычно это делает install.sh):
#   docker compose up -d                        — только Telegram-бот
#   docker compose --profile web up -d          — + веб-интерфейс на localhost сервера (доступ через SSH-туннель)
#   docker compose --profile https up -d        — + веб-интерфейс из интернета по HTTPS с паролем (нужны DOMAIN и WEB_PASSWORD в .env)
# Подробности — DEPLOY.md

x-common: &common
  build: .
  image: ai-council:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./config.yaml:/app/config.yaml:ro   # правьте config.yaml на сервере без пересборки
    - council-runs:/app/runs              # отчёты, стенограммы, настройки чатов бота
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  bot:
    <<: *common
    command: ["python", "-m", "council", "telegram"]

  web:
    <<: *common
    profiles: ["web", "https"]
    command: ["python", "-m", "council", "web", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      TRUST_PROXY: "1"   # реальный IP клиента берётся из X-Forwarded-For (для защиты от перебора пароля)
    # Наружу порт открыт только на самом сервере; из интернета — через Caddy (профиль https)
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3

  caddy:
    image: caddy:2.8
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [web]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # сертификаты
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  council-runs:
  caddy-data:
  caddy-config:
