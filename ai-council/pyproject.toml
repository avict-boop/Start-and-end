[project]
name = "ai-council"
version = "0.1.0"
description = "Совет нейросетей: несколько LLM предлагают, критикуют и голосуют за лучший вариант"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1.0", "pydantic>=2.6,<3", "pyyaml>=6.0,<7", "ruamel.yaml>=0.18,<0.20", "rich>=13.0,<16", "fastapi>=0.110,<1.0", "uvicorn>=0.29,<1.0", "markdown>=3.5,<4", "python-docx>=1.1,<2", "weasyprint>=62,<72", "pypdf>=4.0,<7", "openpyxl>=3.1,<4", "pillow>=10.0,<13", "av>=12,<20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
council = "council.cli:main"

[tool.setuptools]
packages = ["council", "council.modes", "council.web", "council.telegram", "council.reports"]

[tool.setuptools.package-data]
"council.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
