# Конфигурация «Совета нейросетей».
# id моделей — это slug-и OpenRouter. Они периодически обновляются:
# проверить актуальные можно командой `python -m council models <поиск>`.

language: Russian        # на каком языке модели пишут ответы
mode: debate             # quick | debate | evaluate (evaluate включается сам при --option)
debate_rounds: 1         # раундов «критика → доработка» в режиме debate
min_quorum: 2            # минимум участников, чьи предложения получены
max_cost_usd: 2.0        # жёсткий лимит стоимости одного заседания
temperature: 0.7
max_tokens: 16000        # потолок ответа; платится только за написанное. Меньше — длинные ответы дописываются
                         # продолжениями, а каждое продолжение заново читает весь вход (вопрос и вложения)
max_tokens_cap: 32000    # если ответ обрезан, лимит удваивается до этого значения
reasoning_effort: low    # глубина скрытых рассуждений «думающих» моделей (gpt-5, Gemini 2.5…): none|low|medium|high
timeout_s: 180
max_retries: 3           # ретраи при сетевых ошибках / 429 / 5xx
json_retries: 2          # повторы, если модель вернула JSON не по схеме
max_concurrency: 5       # сколько запросов к моделям одновременно (меньше — меньше перерасход у границы бюджета)
judge_temperature: 0.3   # температура постановки, критики, голосования и итога (авторы пишут с temperature)
verdict_max_tokens: 20000  # предел ответа председателя на итоге: длинный синтез без склеек из продолжений
max_requirements: 20     # сколько обязательных требований запроса выписывает постановка
quick_keep: true         # «Быстрый ответ»: голосующие называют ценные идеи проигравших вариантов
evaluate_allow_none: true  # «Выбор из вариантов»: председатель может сказать «ни один не подходит»
budget_reserve: true     # не отправлять запрос, если с ним и уже отправленными бюджет будет превышен (цена — по каталогу)
reserve_output_share: 0.5  # в резерве — такая доля предела ответа модели (1 — худший случай, пауза раньше)
quorum_large: 3          # минимум вариантов в обсуждении и исследовании, когда авторов 4 и больше
reports_memory_mb: 1200  # предел реально занятой памяти сборки отчётов, МБ (0 — без предела; 1 ГБ сервер — 600, 2 ГБ — 1200)
chair_critiques: true    # председатель без своего варианта участвует в критике (эксперимент пилота: false — дешевле)
chair_votes: true        # и в голосовании
key_reserve: true        # общий учёт лимита ключа OpenRouter для сайта и бота: пауза до отказа ключа посреди этапа
log_level: debug         # журнал программы: debug — максимально подробно, info — главное, warning — только сбои
log_file_mb: 10          # размер одного файла журнала, МБ
log_files: 10            # сколько файлов хранить (старые удаляются): 10 × 10 МБ = до 100 МБ на сайт и столько же на бота
web_tools: true          # поиск через инструмент OpenRouter web_search (false — устаревший плагин «web»)
search_unlimited: false  # авторы ищут, сколько сочтут нужным (дольше и дороже; председатель — по search_uses)
search_uses: 3           # поисков у автора за запрос (1–10); для широкого скрининга кандидатов — 6–10
search_results: 5        # результатов в каждом поиске (1–10)
search_engine: exa       # чем ищет web_search: exa — с лимитом 3 поиска × 5 результатов; auto — поиск провайдера (без лимитов у OpenAI и Google, дорого)
json_mode: true          # ответ строго JSON-объектом, где модель умеет: меньше платных повторов из-за формата
vote_reasoning: low      # глубина рассуждений на голосовании: low — дешевле; пусто — как у участника
answer_size: full        # объём итога: full — как требует запрос; brief — кратко (до ~500 слов); меняется для вопроса
pilot_solo_model: ""     # пилот: модель для «ответа одной модели с поиском» (пусто — модель председателя)

chair: claude            # председатель: формулирует критерии и пишет итоговое решение
chair_follows_vote: true # председатель следует голосованию; другой победитель — только по названной причине
compact_proposals: false # true — «компактные варианты»: участники пишут суть сжато (до compact_words слов),
                         # полный ответ в нужном формате пишет только председатель; в 2–3 раза дешевле
compact_words: 700
chair_proposes: false    # false — председатель не предлагает свой вариант (не судит сам себя);
                         # true — председатель ещё и обычный участник со своим вариантом
devil_advocate: deepseek # ищет слабые места и неочевидные альтернативы (можно убрать)
runs_dir: runs           # куда сохранять отчёты и стенограммы

# Фирменное оформление отчётов (PDF, Word, Markdown). Всё необязательно.
# После изменения пересоберите отчёты архива: ai-council reports --force
branding:
  title: ""              # название компании/проекта в шапке и колонтитулах (пусто — «Совет нейросетей»)
  logo: ""               # логотип PNG/JPG, например branding/logo.png (папка branding рядом с config.yaml)
  color: ""              # фирменный цвет, например "#0a7d5a"
  footer: ""             # текст в колонтитуле, например «Конфиденциально»

# Проверка фактов: после голосования модель с поиском в интернете проверяет ключевые утверждения
# в лидирующих вариантах; председатель учитывает результат. Включается и галочкой в вебе,
# кнопкой «🔎 Проверка фактов» в Telegram, ключом --fact-check в командной строке.
# Стоит ~2 запроса к модели с поиском (у Perplexity — плата за токены и за каждый запрос с поиском).
fact_check:
  enabled: false
  model: perplexity/sonar-pro
  top: 2                 # сколько лидеров голосования проверять
  max_claims: 5          # сколько ключевых утверждений на вариант
  read_leads: true      # программа сама открывает ссылки авторов и даёт модели проверки отрывки страниц
  lead_pages: 2         # сколько ссылок на утверждение открывать (0 — не открывать)
  fetch_pages: 3       # сколько страниц модель проверки читает целиком (web_fetch): страница, а не фрагмент; 0 — нет

# Режим «Исследование» (mode: research или выбор на сайте и в боте). Арбитраж доказательств использует
# модель проверки фактов выше. Каждую часть можно выключить, чтобы сравнить на пилоте.
research:
  lenses: true            # у каждого автора свой угол зрения
  arbitration: true       # после критики поиск проверяет утверждения всех вариантов
  missions: 2             # поисковых заданий: найти подтверждения и найти опровержения
  arbitration_claims: 20  # сколько утверждений проверять поиском (3–30; ≈ $0,02–0,05 за каждые 5)
  revision_digest: true   # доработка по реестру источников и выжимкам чужих вариантов
  section_vote: true      # голосование за лучший вариант по каждому подвопросу
  fresh_scouts: 0         # авторов с поиском уже на этапе предложений (0–2; варианты могут стать похожими)
  revision_search: false  # поиск у авторов и на доработке (дорого: каждый поиск заново читает весь контекст доработки)
  max_words: 1400         # ориентир длины варианта; 0 — без ограничения длины
  object_coverage: true   # список объектов в задании — у каждого автора факты о каждом, на проверку — сначала по объекту
  facts_per_object: 1     # фактов о каждом объекте проверять в первую очередь (1–5)
  catalog: false          # «Каталог»: проверок и утверждений — по числу объектов × фактов на объект (до 100)
  max_claims: 8           # утверждений в варианте
  max_evidence: 20        # источников в ответе поиска
  link_check: true        # после арбитража открыть каждую ссылку реестра: мёртвые не подтверждают
  shorten_long: true      # слишком длинный вариант (длиннее max_words × long_factor) — один раз автору на сокращение
  long_factor: 1.5
  author_tokens_per_word: 3.0  # предел ответа автора = max_words × это число (0 — общий max_tokens)
  author_min_tokens: 6000      # но не меньше (и не меньше общего max_tokens): думающим нужно место на рассуждения
  dedupe_claims: true          # одинаковые утверждения разных авторов проверяются один раз
  defer_private: true          # непубличное (права, внутренние цены) и «нигде нет» — сразу в «неизвестно», без поиска
  coverage_first: true         # на проверку — сначала по утверждению на каждый подвопрос, потом по автору
  snippet_rule: critical       # фрагмент страницы — не подтверждение: critical (спорное, быстро меняется) | all | off
  recheck_unclear: 5           # «не удалось проверить» — второй поиск другими запросами (сколько; 0 — нет)
  post_revision_claims: 4      # новые утверждения после доработки — проверить до N (0 — нет)
  vote_ledger: true            # голосующие видят краткий реестр источников
  decision_card: true          # карточка решения на одну страницу — первой в итоге
  mark_unconfirmed: true       # неподтверждённое из «известно» помечается и в тексте итога (в начале и на месте)
  require_claim_ids: true      # «известно» — только с названными проверенными утверждениями реестра
  known_numbers_check: true    # в «известно» нет чисел, которых нет в проверенном утверждении
  check_decisive_private: true # решающее для вывода «непубличное» — один раз проверить публичным поиском
  quote_check: true            # найти на странице дословную цитату, которую привёл поиск; для важного не нашлась — не засчитано
  semantic_audit: true         # теневая сверка смысла «известно» одним запросом без поиска: только показывается, статус не меняет
  semantic_audit_model: ""     # модель для сверки (пусто — модель председателя)
  digest_table_rows: 12        # строк таблиц чужого варианта в выжимке для доработки

# «Подобрать состав»: советник разбирает вопрос и предлагает режим, модели, роли и поиск у участников
advisor:
  model: ""               # модель-советник; пусто — модель председателя
  dossier: true           # обзоры моделей поиском в интернете (обзоры, бенчмарки, известные проблемы)
  dossier_days: 21        # сколько дней обзор считается свежим
  max_candidates: 20      # сколько моделей каталога рассматривать
  question_chars: 30000   # сколько знаков вопроса видит советник (длинные ТЗ — целиком)
  history_min_sessions: 5 # ваша история модели — довод советника, только если заседаний с ней не меньше
  max_arbitration_claims: 30  # потолок «утверждений на проверку», который советник вправе предложить
  max_words_cap: 2500     # потолок длины варианта исследования, который советник вправе предложить

transcribe_model: google/gemini-2.5-flash  # модель для расшифровки голосовых (веб-микрофон и Telegram)

members:
  - name: claude
    model: anthropic/claude-sonnet-4.5
  - name: chatgpt
    model: openai/gpt-5
  - name: gemini
    model: google/gemini-2.5-pro
  - name: kimi
    model: moonshotai/kimi-k2
  - name: deepseek
    model: deepseek/deepseek-chat

  # Дополнительные участники: включите enabled: true
  - name: grok
    model: x-ai/grok-4
    enabled: false
  - name: qwen
    model: qwen/qwen3-max
    enabled: false
  - name: mistral
    model: mistralai/mistral-large
    enabled: false
  - name: llama
    model: meta-llama/llama-4-maverick
    enabled: false
  - name: perplexity        # с поиском в интернете — полезен как фактчекер
    model: perplexity/sonar-pro
    enabled: false
